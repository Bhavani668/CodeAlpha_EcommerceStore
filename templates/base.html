<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CodeAlpha Store{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav>
<a class="brand" href="{% url 'home' %}">CodeAlpha Store</a>
<div class="links">
<a href="{% url 'home' %}">Products</a>
<a href="{% url 'cart' %}">Cart</a>
{% if user.is_authenticated %}
<a href="{% url 'orders' %}">My Orders</a>
<span>Hi, {{ user.username }}</span>
<form method="post" action="{% url 'logout' %}">
{% csrf_token %}<button>Logout</button>
</form>
{% else %}
<a href="{% url 'login' %}">Login</a>
<a href="{% url 'register' %}">Register</a>
{% endif %}
</div>
</nav>
{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
<main>{% block content %}{% endblock %}</main>
<footer>CodeAlpha Full Stack Internship Project</footer>
</body>
</html>
